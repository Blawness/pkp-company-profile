name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # `bun run test`, bukan `bun test` polos: tests/isolated harus
        # dijalankan sebagai proses terpisah (lihat berkas di dalamnya).
        run: bun run test
        env:
          # db/index.ts melempar error saat di-import kalau DATABASE_URL kosong,
          # dan tests/isolated/api-ai-security.test.ts menariknya lewat route AI.
          # Tes unit tidak pernah membuka koneksi, jadi nilai palsu sudah cukup.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
